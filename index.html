<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una cartita para ti 💌</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe0ec 0%, #ffc2d4 50%, #ffb3c6 100%);
      font-family: 'Georgia', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* ── Corazones flotantes de fondo ── */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart-particle {
      position: absolute;
      bottom: -60px;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0)      scale(0.8); opacity: 0.75; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0;    }
    }

    /* ── Contenedor ── */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 120px 16px 32px 16px;
      width: 100%;
      max-width: 480px;
    }

    .title {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      color: #c0004a;
      text-shadow: 0 2px 6px rgba(192,0,74,.25);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #b5476f;
      margin-bottom: 36px;
    }

    /* ── Wrapper ── */
    .envelope-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ── Sobre ── */
    .envelope {
      position: relative;
      width: min(320px, 88vw);
      height: min(210px, 58vw);
      cursor: pointer;
      filter: drop-shadow(0 8px 24px rgba(192,0,74,.3));
      transition: transform .2s ease;
    }
    .envelope:hover { transform: scale(1.03); }

    /* Tapa triangular */
    .envelope-flap {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 55%;
      background: #e8547a;
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform .6s ease, background .3s ease;
      z-index: 3;
      border-radius: 6px 6px 0 0;
    }

    /* Cuerpo */
    .envelope-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 100%;
      background: #f9a8c0;
      border-radius: 6px;
      z-index: 1;
      overflow: hidden;
    }
    .envelope-pocket {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 55%;
      background: #f48fb1;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      z-index: 4;
    }

    /* ── Carta ── */
    .letter {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: 88%;
      background: #fff5f8;
      border-radius: 10px;
      padding: 20px 18px;
      z-index: 2;
      opacity: 0;
      transition: opacity .5s ease .4s, transform .6s ease .4s, z-index 0s .4s;
      box-shadow: 0 4px 20px rgba(192,0,74,.15);
      pointer-events: none;
    }
    .letter-heart { font-size: 2rem; margin-bottom: 10px; }
    .letter-content h2 {
      color: #c0004a;
      font-size: 1.15rem;
      margin-bottom: 10px;
    }
    .letter-content p {
      color: #5c1a33;
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 10px;
    }
    .firma {
      margin-top: 14px;
      color: #a0003e;
      font-style: italic;
      font-size: 0.9rem !important;
    }

    /* ── Estado abierto ── */
    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
      background: #c0004a;
      z-index: 1;
    }
    .envelope.open .letter {
      opacity: 1;
      transform: translateX(-50%) translateY(-85%);
      z-index: 10;
      pointer-events: auto;
    }

    /* ── Botón ── */
    .btn {
      background: linear-gradient(135deg, #e8547a, #c0004a);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: clamp(0.95rem, 3.5vw, 1.05rem);
      font-family: inherit;
      cursor: pointer;
      letter-spacing: .5px;
      box-shadow: 0 4px 18px rgba(192,0,74,.35);
      transition: transform .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(192,0,74,.45); }
    .btn:active { transform: translateY(1px);  box-shadow: 0 2px 10px rgba(192,0,74,.3);  }

    /* ── Explosión de corazones ── */
    .burst-heart {
      position: fixed;
      font-size: 1.6rem;
      pointer-events: none;
      animation: burst 1s ease-out forwards;
      z-index: 999;
    }
    @keyframes burst {
      0%   { opacity: 1; transform: scale(.5)  translate(0, 0); }
      100% { opacity: 0; transform: scale(1.4) translate(var(--tx), var(--ty)); }
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="heartsBg"></div>

  <div class="container">
    <h1 class="title">Hola</h1>
    <p class="subtitle">Toca el sobre para abrir</p>

    <div class="envelope-wrapper">

      <div class="envelope" id="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-body">
          <div class="envelope-pocket"></div>
        </div>

        <div class="letter" id="letter">
          <div class="letter-content">
            <div class="letter-heart">💖</div>
            <h2>Spiderman,</h2>
            <p>
              Me caes muyy mal pero que bonito hacer parte de tu vida.
            </p>
            <p class="firma">Att<br /><strong>Merry Jein</strong></p>
          </div>
        </div>
      </div>

      <button class="btn" id="mainBtn" onclick="toggleEnvelope()">
        ✉️ Abrir carta
      </button>

    </div>
  </div>

  <script>
    /* ── Corazones flotantes ── */
    (function () {
      const container = document.getElementById('heartsBg');
      const symbols   = ['💕','💗','💓','✨','🌸','💖','❤️'];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('span');
        el.classList.add('heart-particle');
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left              = Math.random() * 100 + 'vw';
        el.style.animationDuration = (6 + Math.random() * 8)  + 's';
        el.style.animationDelay    = (Math.random() * 10)      + 's';
        el.style.fontSize          = (1 + Math.random() * 1.2) + 'rem';
        container.appendChild(el);
      }
    })();

    /* ── Abrir / cerrar sobre ── */
    let isOpen = false;

    function toggleEnvelope() {
      const envelope = document.getElementById('envelope');
      const btn      = document.getElementById('mainBtn');
      if (!isOpen) {
        envelope.classList.add('open');
        btn.textContent = '💌 Cerrar carta';
        isOpen = true;
        burstHearts();
      } else {
        envelope.classList.remove('open');
        btn.textContent = '✉️ Abrir carta';
        isOpen = false;
      }
    }

    document.getElementById('envelope').addEventListener('click', toggleEnvelope);

    /* ── Explosión de corazones ── */
    function burstHearts() {
      const symbols = ['💖','💗','💕','✨','🌸','❤️','💓'];
      const rect    = document.getElementById('envelope').getBoundingClientRect();
      const startX  = rect.left + rect.width  / 2;
      const startY  = rect.top  + rect.height / 2;

      for (let i = 0; i < 20; i++) {
        const el    = document.createElement('span');
        el.classList.add('burst-heart');
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left  = startX + 'px';
        el.style.top   = startY + 'px';

        const angle = Math.random() * 2 * Math.PI;
        const dist  = 80 + Math.random() * 140;
        el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        el.style.animationDelay = (Math.random() * 0.3) + 's';

        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }
  </script>
</body>
</html>
